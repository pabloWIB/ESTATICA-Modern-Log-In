<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Page not found — Modern Log In React interface demo</title>
  <meta name="description"
    content="This address does not exist on the Modern Log In demo. The site is a single-page React login interface, so head back to the home page to see it in full." />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- This page is served outside the React bundle, so its styles are inlined
       rather than linked to a build file whose hashed name is not known here. -->
  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-grid: rgba(255, 255, 255, 0.045);
      --color-glow: rgba(172, 0, 0, 0.38);
      --color-surface: rgba(193, 88, 88, 0.28);
      --color-surface-border: rgba(193, 88, 88, 0.49);
      --color-accent: #650000;
      --color-accent-hover: #ac0000;
      --color-accent-active: #7d0000;
      --color-text: #ffffff;
      --color-text-muted: #e6d4d4;
      --color-focus-ring: #ffd9d9;
      --space-2: 8px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
      --space-6: 48px;
      --font-sans:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
        "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
        sans-serif;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-xl: 1.5rem;
      --radius-md: 8px;
      --radius-lg: 28px;
      --tap-target: 44px;
      --transition: 180ms ease;
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-4) var(--space-3);
      background-color: var(--color-bg);
      background-image:
        radial-gradient(circle at 50% 45%, var(--color-glow) 0%, transparent 45%),
        linear-gradient(to right, var(--color-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--color-grid) 1px, transparent 1px);
      background-size: 100% 100%, 96px 96px, 96px 96px;
      background-attachment: fixed;
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: var(--space-4);
      background-color: var(--color-surface);
      border: 2px solid var(--color-surface-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: center;
    }

    .card__code {
      margin: 0;
      font-size: var(--text-sm);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    .card__title {
      margin: var(--space-2) 0 0;
      font-size: var(--text-xl);
      font-weight: 600;
      line-height: 1.2;
    }

    .card__text {
      margin: var(--space-3) 0 0;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    .card__link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap-target);
      margin-top: var(--space-5);
      padding: var(--space-2) var(--space-3);
      background-color: var(--color-accent);
      border-radius: var(--radius-md);
      color: var(--color-text);
      font-weight: 600;
      text-decoration: none;
      transition: background-color var(--transition);
    }

    .card__link:hover {
      background-color: var(--color-accent-hover);
    }

    .card__link:active {
      background-color: var(--color-accent-active);
    }

    :focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    @media (min-width: 480px) {
      .card {
        padding: var(--space-6) var(--space-5);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="card__code">Error 404</p>
    <h1 class="card__title">Page not found</h1>
    <p class="card__text">
      Modern Log In is a single screen, so this address leads nowhere.
    </p>
    <a class="card__link" href="/">Back to the login screen</a>
  </main>
</body>

</html>
